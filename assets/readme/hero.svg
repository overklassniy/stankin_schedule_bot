<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">СТАНКИН Расписание — Telegram-бот для ежедневной отправки расписания занятий</title>
  <desc id="hero-desc">Hero: слева название проекта и краткое описание, справа пример реального сообщения бота с расписанием на день.</desc>

  <!-- Фон: тёплый кремовый -->
  <rect width="1200" height="460" rx="26" fill="#F5F2EC"/>

  <!-- Тонкая разделительная линия -->
  <line x1="700" y1="56" x2="700" y2="404" stroke="#E5DFD3" stroke-width="1"/>

  <!-- ЛЕВЫЙ БЛОК -->
  <g transform="translate(64 72)">
    <!-- Бровь: категория -->
    <text x="0" y="0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2"
          fill="#8A8174">
      TELEGRAM-БОТ · РАСПИСАНИЕ
    </text>

    <!-- Название: СТАНКИН -->
    <text x="0" y="64"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="64" font-weight="700"
          fill="#1F1B16">
      СТАНКИН
    </text>
    <!-- Название: Расписание (акцент — янтарный) -->
    <text x="0" y="124"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="64" font-weight="700"
          fill="#B45309">
      Расписание
    </text>

    <!-- Описание -->
    <text x="0" y="178"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="400"
          fill="#3D362C">
      Ежедневная отправка расписания занятий
    </text>
    <text x="0" y="206"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="400"
          fill="#3D362C">
      в чат вашей группы — по команде и автоматически.
    </text>

    <!-- Метаданные -->
    <g transform="translate(0 268)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="1"/>
      <text x="50" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#6B6358">
        Python 3.13
      </text>

      <rect x="108" y="0" width="104" height="28" rx="14" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="1"/>
      <text x="160" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#6B6358">
        aiogram 3
      </text>

      <rect x="220" y="0" width="74" height="28" rx="14" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="1"/>
      <text x="257" y="19" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#6B6358">
        SQLite
      </text>
    </g>
  </g>

  <!-- ПРАВЫЙ БЛОК: реальное сообщение бота -->
  <g transform="translate(736 56)">
    <!-- Пузырь сообщения (как в Telegram) -->
    <rect x="0" y="0" width="408" height="348" rx="18" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="1"/>
    <!-- Хвостик пузыря -->
    <path d="M0 24 L -10 18 L 0 36 Z" fill="#FFFFFF"/>

    <!-- Заголовок сообщения (жирный, как в create_message) -->
    <text x="20" y="34"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700"
          fill="#1F1B16">
      Доброе утро, сегодня понедельник.
    </text>
    <text x="20" y="54"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700"
          fill="#1F1B16">
      Расписание на сегодня:
    </text>

    <!-- Карточка пары 1 (blockquote) -->
    <g transform="translate(20 74)">
      <rect x="0" y="0" width="368" height="78" rx="10" fill="#FBF8F2"/>
      <rect x="0" y="0" width="3" height="78" fill="#B45309"/>
      <text x="16" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14" font-weight="600"
            fill="#1F1B16">
      </text>
      <text x="34" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14" font-weight="600"
            fill="#1F1B16">
        Математический анализ
      </text>
      <text x="16" y="42"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
      </text>
      <text x="34" y="42"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Иванов И.И. · Лекция
      </text>
      <text x="34" y="60"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Каб. 305 · 01.09 - 31.12
      </text>
      <text x="354" y="22" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" font-weight="600"
            fill="#B45309">
        8:30 - 10:05
      </text>
    </g>

    <!-- Карточка пары 2 (blockquote, лабораторная с подгруппой) -->
    <g transform="translate(20 164)">
      <rect x="0" y="0" width="368" height="78" rx="10" fill="#FBF8F2"/>
      <rect x="0" y="0" width="3" height="78" fill="#B45309"/>
      <text x="34" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14" font-weight="600"
            fill="#1F1B16">
        Программирование
      </text>
      <text x="34" y="42"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Петров П.П. · Лаб. работа
      </text>
      <text x="34" y="60"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Группа: 1 · Каб. 214 · 01.09 - 31.12
      </text>
      <text x="354" y="22" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" font-weight="600"
            fill="#B45309">
        10:15 - 11:50
      </text>
    </g>

    <!-- Карточка пары 3 (blockquote, онлайн) -->
    <g transform="translate(20 254)">
      <rect x="0" y="0" width="368" height="78" rx="10" fill="#FBF8F2"/>
      <rect x="0" y="0" width="3" height="78" fill="#B45309"/>
      <text x="34" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="14" font-weight="600"
            fill="#1F1B16">
        Иностранный язык
      </text>
      <text x="34" y="42"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Сидорова С.С. · Семинар
      </text>
      <text x="34" y="60"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12"
            fill="#6B6358">
        Онлайн · 01.09 - 31.12
      </text>
      <text x="354" y="22" text-anchor="end"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" font-weight="600"
            fill="#B45309">
        12:20 - 13:55
      </text>
    </g>
  </g>
</svg>
